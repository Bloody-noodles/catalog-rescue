name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: catalog_rescue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: catalog-rescue-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalog_rescue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CATALOG_RESCUE_TEST_DATABASE_URL: postgresql+psycopg://postgres:catalog-rescue-ci-only@localhost:5432/catalog_rescue_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
